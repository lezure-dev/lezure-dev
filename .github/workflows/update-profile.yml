name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "ascii/**"
      - "generate_profile.py"
      - "patch_stats_edge_alignment.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LOC counter
        run: sudo apt-get update && sudo apt-get install -y cloc
      - name: Apply stats edge alignment
        run: python patch_stats_edge_alignment.py
      - name: Regenerate profile
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: python generate_profile.py
      - name: Commit generated assets and stats cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_profile.py assets/dark_mode.svg assets/light_mode.svg stats_cache.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile"
          git pull --rebase origin main
          git push
